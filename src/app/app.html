<mat-toolbar class="top-bar">
  <div class="header-text">
    <span class="brand">Bilbao Guide ⚡</span>
    <span class="page-subtitle">{{ currentSubtitle }}</span>
  </div>

  <span class="spacer"></span>

  <button
    mat-icon-button
    routerLink="/avatar-selector"
    class="avatar-button"
    aria-label="Cambiar avatar"
  >
    <img [src]="avatarUrl" alt="Avatar" class="top-avatar">
  </button>
</mat-toolbar>

<div class="content-container">
  <router-outlet></router-outlet>
</div>

<mat-toolbar class="bottom-nav">
  <button mat-icon-button routerLink="/home" routerLinkActive="active-link">
    <mat-icon>home</mat-icon>
  </button>

  <button mat-icon-button routerLink="/itinerary" routerLinkActive="active-link">
    <mat-icon>map</mat-icon>
  </button>

  <button mat-icon-button routerLink="/places" routerLinkActive="active-link">
    <mat-icon>place</mat-icon>
  </button>

  <button mat-icon-button routerLink="/passport" routerLinkActive="active-link">
    <mat-icon>local_activity</mat-icon>
  </button>

  <button
    *ngIf="isAdminMode"
    mat-icon-button
    routerLink="/pending-requests"
    routerLinkActive="active-link"
  >
    <mat-icon>notifications</mat-icon>
  </button>
</mat-toolbar>
